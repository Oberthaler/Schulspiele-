<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Escape Room – Maschinenhalle</title>
<style>
body {
 font-family: Arial;
 color:white;
 text-align:center;
 background:url('https://images.unsplash.com/photo-1503387762-592deb58ef4e') no-repeat center center fixed;
 background-size:cover;
}
.container { width:950px; margin:20px auto; background:rgba(30,30,30,0.9); padding:20px; border-radius:12px; }
.map { display:grid; grid-template-columns: repeat(5, 1fr); gap:6px; margin-bottom:15px; }
.room { height:60px; background:#444; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:12px; }
.current { background:red !important; }
.exit { background:green !important; }
button { padding:10px; margin:5px; border:none; border-radius:6px; cursor:pointer; }
.choiceBtn { background:#333; color:white; }
#lives { position:absolute; right:30px; top:20px; font-size:20px; }
.overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:#000; color:white; display:flex; flex-direction:column; justify-content:center; align-items:center; }
.trapScreen { position:fixed; top:0; left:0; width:100%; height:100%; background:black; display:flex; flex-direction:column; justify-content:center; align-items:center; }
.trapScreen img { width:250px; }
.trapText { font-size:40px; color:red; margin-top:20px; }
</style>
</head>
<body>

<div id="lives"></div>

<div id="startScreen" class="overlay">
<h1>🔐 Escape Room: Die verlassene Maschinenhalle</h1>
<p>Du bist in einer alten Maschinenhalle gefangen. Zahnräder knarren, Seile bewegen sich.</p>
<p>❤️ 5 Leben | 💀 Fallen werfen dich zurück | ❌ Fehler kosten Leben</p>
<p>🎯 Ziel: Erreiche Raum 15 (EXIT)</p>
<button onclick="startGame()">OK – Spiel starten</button>
</div>

<div class="container" id="game" style="display:none;">
<h1>Escape the Room</h1>
<div id="map" class="map"></div>
<p id="story"></p>
<p id="question"></p>
<div id="answers"></div>
<div id="choices"></div>
<p id="result"></p>
</div>

<script>

const rooms = [
{q:"Welche Aussage beschreibt die goldene Regel der Mechanik korrekt?", a:["Die Arbeit bleibt gleich","Die Kraft verschwindet","Der Weg wird kleiner","Die Energie wird größer"], c:0},
{q:"Welche Funktion hat eine feste Rolle in einem Seilsystem?", a:["Sie halbiert die Kraft","Sie lenkt die Kraft um","Sie speichert Energie","Sie vergrößert die Masse"], c:1},
{q:"Welche Krafterleichterung ergibt sich bei einer losen Rolle?", a:["1:2","1:1","1:3","2:1"], c:0},
{q:"Wie verändert sich der Weg bei einer losen Rolle?", a:["Er bleibt gleich","Er halbiert sich","Er verdoppelt sich","Er verschwindet"], c:2},
{q:"Was bewirkt eine Kombination aus fester und loser Rolle?", a:["Mehr Kraft","Gleiche Krafterleichterung","Keine Wirkung","Unendliche Kraft"], c:1},
{q:"Welche Kraft wirkt auf die Decke bei dieser Kombination?", a:["1,5 der Gewichtskraft","0,5 der Gewichtskraft","2 der Gewichtskraft","Gleich der Gewichtskraft"], c:0},
{q:"Was ist ein Flaschenzug?", a:["Ein Seil","Mehrere Rollen und Seile","Ein Zahnrad","Ein Motor"], c:1},
{q:"Wie verteilt sich die Kraft beim Faktorenflaschenzug?", a:["Gleichmäßig","Ungleichmäßig","Nur auf ein Seil","Gar nicht"], c:0},
{q:"Wie berechnet sich die Deckenbelastung beim Faktorenflaschenzug?", a:["Gewicht + Zugkraft","Nur Gewicht","Nur Zugkraft","Gewicht minus Zugkraft"], c:0},
{q:"Was ist typisch für den Potenzflaschenzug?", a:["Gleiche Kräfte","Unterschiedliche Kräfte","Keine Rollen","Keine Wirkung"], c:1},
{q:"Wie verändert sich die Kraft beim Potenzflaschenzug?", a:["Sie halbiert sich je Rolle","Sie bleibt gleich","Sie verdoppelt sich","Sie verschwindet"], c:0},
{q:"Was zeichnet den Differenzialflaschenzug aus?", a:["Zwei unterschiedliche Rollen","Zwei gleiche Rollen","Nur lose Rollen","Keine Seile"], c:0},
{q:"Wie verhält sich die Seillänge beim Differenzialflaschenzug?", a:["Nahezu unabhängig","Sehr groß","Immer doppelt","Sehr klein"], c:0},
{q:"Warum verringert sich die Effizienz realer Flaschenzüge?", a:["Durch Reibung","Durch Gravitation","Durch Licht","Durch Temperatur"], c:0},
{q:"Wie wirkt sich die Anzahl der Rollen auf die Reibung aus?", a:["Sie steigt","Sie sinkt","Sie bleibt gleich","Sie verschwindet"], c:0}
];

let current = 0;
let previous = 0;
let lives = 5;
let canMove = false;

// Fallen so setzen, dass Weg frei bleibt
let traps = [];
while(traps.length < 3){
let r = Math.floor(Math.random()*15);
if(r !== 0 && r !== 14 && !traps.includes(r) && r!==4 && r!==9){
traps.push(r);
}
}

function startGame(){
document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";
loadRoom();
}

function updateLives(){
document.getElementById("lives").innerText = "❤️".repeat(lives);
}

function renderMap(){
const map = document.getElementById("map");
map.innerHTML="";
for(let i=0;i<15;i++){
let div=document.createElement("div");
let cls = "room";
if(i===current) cls += " current";
if(i===14) cls += " exit";
div.className=cls;
div.innerText = i===14 ? "EXIT" : "Raum "+(i+1);
map.appendChild(div);
}
}

function neighbors(i){
let n=[];
if(i%5!==0) n.push(i-1);
if(i%5!==4) n.push(i+1);
if(i-5>=0) n.push(i-5);
if(i+5<15) n.push(i+5);
return n;
}

function showTrap(){
let trapDiv = document.createElement("div");
trapDiv.className="trapScreen";
trapDiv.innerHTML='<img src="https://images.unsplash.com/photo-1601758003122-58d6b3f3f3b1"><div class="trapText">FALLE!</div>';
document.body.appendChild(trapDiv);
setTimeout(()=>{ trapDiv.remove(); loadRoom(); },1500);
}

function loadRoom(){
updateLives();
renderMap();
canMove=false;

if(current===14) return win();

if(traps.includes(current)){
lives--;
current = previous;
if(lives<=0) return gameOver();
return showTrap();
}

let r = rooms[current];
document.getElementById("story").innerText = "Du gehst vorsichtig durch die Maschinenhalle. Über dir hängen schwere Lasten und jede falsche Entscheidung könnte dich zurückwerfen.";
document.getElementById("question").innerText = r.q;

let answers=document.getElementById("answers");
answers.innerHTML="";
r.a.forEach((ans,i)=>{
let btn=document.createElement("button");
btn.innerText=ans;
btn.onclick=()=>check(i);
answers.appendChild(btn);
});
}

function check(i){
if(i===rooms[current].c){
document.getElementById("result").innerText="✔ Richtig! Wähle deinen nächsten Raum.";
canMove=true;
showChoices();
} else {
lives--;
document.getElementById("result").innerText="❌ Falsch! Leben verloren.";
if(lives<=0) return gameOver();
updateLives();
}
}

function showChoices(){
let div=document.getElementById("choices");
div.innerHTML="";
neighbors(current).forEach(r=>{
let btn=document.createElement("button");
btn.className="choiceBtn";
btn.innerText="Gehe zu Raum "+(r+1);
btn.onclick=()=>{
if(canMove){
previous=current;
current=r;
loadRoom();
}
};
div.appendChild(btn);
});
}

function gameOver(){
document.body.innerHTML="<h1>💀 Game Over</h1><button onclick='location.reload()'>Neustart</button>";
}

function win(){
document.body.innerHTML="<h1>🎉 Geschafft!</h1><button onclick='location.reload()'>Neustart</button>";
}

</script>

</body>
</html>
